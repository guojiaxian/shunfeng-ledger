<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FBF9F3" />
<title>预览 · 统计界面 v1.2.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* ---------- Design Tokens ---------- */
  :root{
    --ink: #FBF9F3;
    --ink-2: #FFFFFF;
    --ink-3: #F6F1E5;
    --surface: #EFE7D6;
    --surface-2: #E4D9C2;
    --line: rgba(42,35,30,0.08);
    --line-strong: rgba(42,35,30,0.16);
    --paper: #2A231E;
    --paper-dim: #6E6357;
    --muted: #9B8E7E;
    --muted-2: #B8AE9E;
    --gold: #D49815;
    --gold-soft: #E6A823;
    --gold-deep: #A8760A;
    --gaode: #2E8B7E;
    --didi: #D9682A;
    --shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 8px 28px -14px rgba(42,35,30,0.22);
    --r-md: 16px;
    --r-lg: 22px;
    --ease: cubic-bezier(.2,.7,.2,1);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--ink);
    color: var(--paper);
    font-family: 'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    min-height: 100vh;
    background-image:
      radial-gradient(1200px 600px at 80% -10%, rgba(230,168,35,0.14), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(46,139,126,0.05), transparent 60%);
  }
  .serif{ font-family:'Fraunces', Georgia, serif; font-optical-sizing:auto; }
  .tnum{ font-variant-numeric: tabular-nums; }
  .app{ max-width: 980px; margin: 0 auto; padding: 0 18px 80px; }

  /* Header */
  header.top{
    margin: 0 -18px 0;
    padding: 14px 18px 12px;
    border-bottom: 1px solid var(--line);
    background: rgba(251,249,243,0.6);
  }
  .top-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{
    width:34px; height:34px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    filter: drop-shadow(0 4px 10px rgba(230,168,35,.35));
  }
  .brand .mark svg{ width:100%; height:100%; display:block; }
  .brand h1{
    font-family:'Fraunces', serif;
    font-weight:500; font-size:22px; letter-spacing:-0.01em;
    margin:0; line-height:1;
  }
  .date-pill{
    font-size:12px; color:var(--paper-dim);
    padding:7px 23px; border-radius:999px;
    background: rgba(42,35,30,0.05);
    border:1px solid var(--line);
    display:flex; align-items:center; gap:7px;
    white-space:nowrap; flex-shrink:0;
  }
  .date-pill .dot{ width:6px; height:6px; border-radius:50%; background:var(--gold); box-shadow:0 0 10px var(--gold);}
  .top-right{ display:flex; align-items:center; gap:10px; }
  .icon-btn{
    appearance:none; cursor:pointer; border:1px solid var(--line);
    background: rgba(42,35,30,.04); color: var(--paper-dim);
    width:34px; height:34px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    transition: all .2s var(--ease);
  }
  .icon-btn svg{ width:16px; height:16px; }

  /* section head + chips */
  .sec-head{ display:flex; align-items:center; justify-content:space-between; margin: 26px 0 16px; }
  .sec-head h2{ font-family:'Fraunces',serif; font-weight:500; font-size:24px; margin:0; letter-spacing:-0.01em;}
  .sec-head .tools{ display:flex; gap:8px; align-items:center; }
  .chip{
    appearance:none; cursor:pointer;
    font-size:12px; padding:7px 13px; border-radius:999px;
    border:1px solid var(--line); background: var(--ink-2);
    color: var(--paper-dim); transition: all .2s var(--ease); font-family: inherit;
  }
  .chip.active{ background: var(--paper); color: var(--ink); border-color: var(--paper);}

  /* stats grid */
  .stats-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap:14px; margin-bottom: 18px; }
  .stat-mini{
    background: var(--ink-3); border:1px solid var(--line);
    border-radius: var(--r-md); padding: 14px 16px;
    box-shadow: var(--shadow);
  }
  .stat-mini .k{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color: var(--muted); }
  .stat-mini .v{ font-family:'Manrope', system-ui, sans-serif; font-weight:600; font-size:24px; margin-top:6px; letter-spacing:-0.01em;}
  .stat-mini .v .cur{ font-size:13px; color: var(--muted);}
  .stat-mini .v .dec{ font-size:15px; color: var(--paper-dim);}
  .stat-mini .sub{ font-size:11px; color: var(--muted-2); margin-top:3px;}
  .stat-mini.dual{ padding: 14px 16px; }
  .stat-mini.dual .dual-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-top:6px; }
  .stat-mini.dual .dg-item .dg-k{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color: var(--muted); }
  .stat-mini.dual .dg-item .dg-v{ font-family:'Manrope', system-ui, sans-serif; font-weight:600; font-size:24px; letter-spacing:-0.01em; line-height:1.15;}
  .stat-mini.dual .dual-foot{ grid-column: 1 / -1; font-size:11px; color: var(--muted-2); margin-top:2px; }

  /* panels */
  .panel{
    background: var(--ink-3);
    border:1px solid var(--line-strong);
    border-radius: var(--r-lg);
    padding: 20px 18px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; gap: 12px; flex-wrap: nowrap; margin-bottom: 16px; }
  .panel-head h3{ font-family:'Fraunces',serif; font-weight:500; font-size:17px; margin:0; letter-spacing:-0.01em; display:flex; align-items:center; gap:8px; flex-shrink: 1; min-width: 0; white-space: nowrap;}
  .panel-head h3 .badge{ font-size:10px; padding:3px 7px; border-radius:999px; background: rgba(230,168,35,.14); color: var(--gold-soft); border:1px solid rgba(230,168,35,.25); letter-spacing:.06em; flex-shrink:0;}
  .panel-head .legend{ margin-top: 0; gap: 10px; flex-wrap: nowrap; flex-shrink: 0;}
  .chart-wrap{ width:100%; }
  .chart-wrap svg{ display:block; width:100%; height:auto; }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; }
  .legend .li{ display:flex; align-items:center; gap:6px; font-size:12px; color: var(--paper-dim); white-space:nowrap;}
  .legend .sw{ width:10px; height:10px; border-radius:3px; flex-shrink:0;}
  .legend .li b{ color: var(--paper); font-weight:600;}
  .pf-breakdown{ display:flex; flex-direction:column; gap:12px; margin-top:6px; }
  .pf-row .top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .pf-row .name{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color: var(--paper);}
  .pf-row .name .sw{ width:10px; height:10px; border-radius:3px;}
  .pf-row .vals{ font-size:13px; color: var(--paper-dim); }
  .pf-row .vals b{ color: var(--gold-soft); font-weight:700; font-family:'Manrope', system-ui, sans-serif; font-size:15px;}
  .bar-track{ height:8px; background: rgba(42,35,30,.05); border-radius:99px; overflow:hidden;}
  .bar-fill{ height:100%; border-radius:99px; transition: width .6s var(--ease); }

  /* preview bar */
  .pv-bar{
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 99; display:flex; gap:8px; align-items:center;
    background: rgba(42,35,30,.92); color:#FBF9F3; padding:8px 14px; border-radius:999px;
    font-size:12px; box-shadow: 0 8px 24px rgba(0,0,0,.25);
    backdrop-filter: blur(8px);
  }
  .pv-bar button{ appearance:none; border:none; cursor:pointer; background: var(--gold-soft); color:#2A231E; font-weight:600; font-size:12px; padding:6px 12px; border-radius:999px; font-family: inherit;}
  .pv-bar .lbl{ opacity:.8; }

  @media (max-width: 680px){
    .stats-grid{ grid-template-columns: 1fr 1fr; }
    .panel-head{ gap: 8px; }
    .panel-head h3{ font-size: 16px; gap: 6px; }
    .panel-head .legend{ gap: 8px; }
    .panel-head .legend .li{ font-size: 11.5px; gap: 5px; }
  }
  @media (max-width: 480px){
    .stats-grid{ grid-template-columns: 1fr; }
    .pv-bar{ top: auto; bottom: 12px; }
    .panel-head h3{ font-size: 15px; }
    .panel-head h3 .badge{ font-size:9.5px; padding:2.5px 6px;}
    .panel-head .legend .li{ font-size: 11px; gap: 4px; }
    .panel-head .legend .sw{ width:9px; height:9px; }
  }
</style>
</head>
<body>
  <div class="pv-bar">
    <span class="lbl">v1.2.2 预览</span>
    <button id="pvRegen">重新生成数据</button>
  </div>

  <div class="app">
    <!-- Header -->
    <header class="top">
      <div class="top-row">
        <div class="brand">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="0" y="0" width="48" height="48" rx="10" fill="#FBF9F3"/>
              <circle cx="24" cy="22" r="13" fill="#E6A823"/>
              <circle cx="24" cy="22" r="13" fill="none" stroke="#B07A0E" stroke-width="1.4"/>
              <circle cx="24" cy="22" r="7.6" fill="none" stroke="#2A231E" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M16.4,19.8 a7.6,7.6 0 0,1 15.2,0" fill="none" stroke="#2A231E" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M27.2,14 L30.6,18.2 L27.4,19.4" fill="none" stroke="#2A231E" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M15,38 L33,38" fill="none" stroke="#A8760A" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M18,41.5 L30,41.5" fill="none" stroke="#9B8E7E" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </div>
          <div>
            <h1 class="serif">顺风·账本</h1>
          </div>
        </div>
        <div class="top-right">
          <div class="date-pill" id="todayPill">
            <span class="dot"></span>
            <span id="todayText">8月4日 周一</span>
          </div>
          <button class="icon-btn" id="btnShare" aria-label="分享截图" title="分享">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          </button>
          <button class="icon-btn" id="btnSettings" aria-label="设置" title="设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Stats View -->
    <section class="view" id="view-stats">
      <div class="sec-head">
        <h2 class="serif">数据洞察</h2>
        <div class="tools" id="rangeFilter">
          <button class="chip" data-range="7">近7天</button>
          <button class="chip active" data-range="30">近30天</button>
          <button class="chip" data-range="all">全部</button>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-mini">
          <div class="k">总收入</div>
          <div class="v tnum"><span class="cur">¥</span><span id="sTotal">0</span><span class="dec">.00</span></div>
          <div class="sub" id="sTotalSub">— 单</div>
        </div>
        <div class="stat-mini">
          <div class="k">总利润</div>
          <div class="v tnum"><span class="cur">¥</span><span id="sProfit">0</span><span class="dec">.00</span></div>
          <div class="sub" id="sProfitSub">利润率 75%</div>
        </div>
        <div class="stat-mini dual">
          <div class="k">订单数</div>
          <div class="dual-grid">
            <div class="dg-item">
              <div class="dg-k">总订单</div>
              <div class="dg-v tnum"><span id="sOrders">0</span><span style="font-size:13px;color:var(--muted);margin-left:2px;">单</span></div>
            </div>
            <div class="dg-item">
              <div class="dg-k">总天数</div>
              <div class="dg-v tnum"><span id="sDays">0</span><span style="font-size:13px;color:var(--muted);margin-left:2px;">天</span></div>
            </div>
            <div class="dual-foot" id="sOrdersSub">日均 — 单</div>
          </div>
        </div>
        <div class="stat-mini">
          <div class="k">客单价</div>
          <div class="v tnum"><span class="cur">¥</span><span id="sAvg">0</span></div>
          <div class="sub">每单平均</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3 class="serif">收入趋势<span class="badge" id="trendBadge">每日</span></h3>
          <div class="legend" id="trendLegend"></div>
        </div>
        <div class="chart-wrap" id="trendChart"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3 class="serif">平台占比</h3>
          <div class="legend" id="pfLegend"></div>
        </div>
        <div class="chart-wrap" id="donutChart"></div>
        <div class="pf-breakdown" id="pfBreakdown"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3 class="serif">时间段分布<span class="badge" id="hourBadge">接单时段</span></h3>
        </div>
        <div class="chart-wrap" id="hourChart"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3 class="serif">金额分布<span class="badge" id="amtBadge">区间统计</span></h3>
        </div>
        <div class="chart-wrap" id="amtChart"></div>
      </div>
    </section>

  </div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const pad = n => String(n).padStart(2,'0');
const parseDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const money = n => {
  const v = Math.round((Number(n)||0)*100)/100;
  return v.toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});
};
const moneyParts = n => {
  const v = Math.round((Number(n)||0)*100)/100;
  const [int, dec] = money(v).split('.');
  return { int, dec };
};
const num = n => (Number(n)||0).toLocaleString('zh-CN');
const orderIncome = r => (Number(r.amount)||0);
const calcProfit = total => Math.round(total * 0.75 * 100)/100;
function daysBetween(a,b){ return Math.round((b - a) / 86400000); }
function niceCeil(v){
  if(v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v/mag;
  let nice;
  if(n <= 1) nice = 1;
  else if(n <= 2) nice = 2;
  else if(n <= 2.5) nice = 2.5;
  else if(n <= 5) nice = 5;
  else nice = 10;
  return nice * mag;
}
function emptyChart(msg){
  return `<div style="text-align:center;padding:40px 10px;color:var(--muted-2);font-size:13px;">${msg}</div>`;
}
function linePath(series, xAt, yAt){
  return series.map((v,i)=> `${i===0?'M':'L'} ${xAt(i).toFixed(1)} ${yAt(v).toFixed(1)}`).join(' ');
}

/* ---------- mock data ---------- */
let DB = [];
let statRange = 30;

function genMockData(){
  DB = [];
  const now = new Date(); now.setHours(0,0,0,0);
  const days = 45;
  for(let i=0;i<days;i++){
    const d = new Date(now); d.setDate(d.getDate()-i);
    const date = fmtDate(d);
    // 每天 0~3 单
    const cnt = Math.random() < 0.25 ? 0 : (Math.random() < 0.6 ? 1 : (Math.random() < 0.5 ? 2 : 3));
    for(let j=0;j<cnt;j++){
      const platform = Math.random() < 0.62 ? 'gaode' : 'didi';
      // 时段：偏早晚高峰
      const hourPick = Math.random();
      let h;
      if(hourPick < 0.30) h = 6 + Math.floor(Math.random()*3);       // 早高峰 6-9
      else if(hourPick < 0.55) h = 16 + Math.floor(Math.random()*3); // 晚高峰 16-19
      else if(hourPick < 0.75) h = 19 + Math.floor(Math.random()*3);  // 夜间 19-22
      else h = Math.floor(Math.random()*24);
      const mi = Math.floor(Math.random()*60);
      const time = `${pad(h)}:${pad(mi)}`;
      // 金额：15~95，偏中低
      const amount = Math.round((15 + Math.random()*Math.random()*80)*100)/100;
      const distance = Math.round((3 + Math.random()*40)*10)/10;
      const duration = Math.round(10 + Math.random()*60);
      DB.push({
        id: 'm'+i+'-'+j,
        platform, date, time, amount, distance, duration,
        pickup: '某地', dropoff: '某地',
        note: '', createdAt: Date.now()
      });
    }
  }
}

function getStatRecords(){
  if(statRange === 'all') return DB.slice();
  const since = new Date(); since.setHours(0,0,0,0); since.setDate(since.getDate() - (statRange-1));
  return DB.filter(r => parseDate(r.date) >= since);
}

function renderStats(){
  const data = getStatRecords();
  const total = data.reduce((a,r)=>a+orderIncome(r), 0);
  const orders = data.length;
  const days = new Set(data.map(r=>r.date)).size || 1;
  const avg = orders ? total/orders : 0;
  const profit = calcProfit(total);
  const profitRate = 75;

  const tP = moneyParts(total);
  $('#sTotal').textContent = tP.int;
  $('#sTotal').parentElement.querySelector('.dec').textContent = '.'+tP.dec;
  $('#sTotalSub').textContent = `${orders} 单`;
  $('#sOrders').textContent = num(orders);
  $('#sDays').textContent = num(days);
  $('#sOrdersSub').textContent = `日均 ${orders ? (orders/days).toFixed(1) : 0} 单`;
  $('#sAvg').textContent = num(Math.round(avg));
  const pP = moneyParts(profit);
  $('#sProfit').textContent = pP.int;
  $('#sProfit').parentElement.querySelector('.dec').textContent = '.'+pP.dec;
  $('#sProfitSub').textContent = `利润率 ${profitRate}%`;

  drawTrend(data);
  drawDonut(data);
  drawHourDist(data);
  drawAmtDist(data);
}

/* ---------- Trend line chart ---------- */
function drawTrend(data){
  const wrap = $('#trendChart');
  const badge = $('#trendBadge');
  const legend = $('#trendLegend');
  let days;
  if(statRange === 'all'){
    if(data.length === 0){ wrap.innerHTML = emptyChart('暂无数据'); badge.textContent='每日'; legend.innerHTML=''; return; }
    const dates = data.map(r=>r.date).sort();
    const start = parseDate(dates[0]), end = parseDate(dates[dates.length-1]);
    days = Math.max(1, daysBetween(start, end) + 1);
    if(days > 60){ const s = new Date(end); s.setDate(s.getDate()-59); start.setTime(s.getTime()); days = 60; }
    var seriesStart = start;
  } else {
    days = statRange;
    var seriesStart = (()=>{ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-(days-1)); return d; })();
  }
  badge.textContent = `近 ${days} 天`;
  const labels = [], gaodeSeries = [], didiSeries = [], totalSeries = [];
  for(let i=0;i<days;i++){
    const d = new Date(seriesStart); d.setDate(d.getDate()+i);
    const key = fmtDate(d);
    labels.push(key);
    let g=0, dd=0;
    data.forEach(r => { if(r.date===key){ if(r.platform==='gaode') g+=orderIncome(r); else dd+=orderIncome(r);} });
    gaodeSeries.push(g); didiSeries.push(dd); totalSeries.push(g+dd);
  }
  const W=720, H=220, padL=44, padR=14, padT=18, padB=28;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const maxV = Math.max(1, ...totalSeries);
  const niceMax = niceCeil(maxV);
  const xAt = i => padL + (days<=1 ? innerW/2 : (i/(days-1))*innerW);
  const yAt = v => padT + innerH - (v/niceMax)*innerH;
  let grid = '';
  const steps = 4;
  for(let s=0;s<=steps;s++){
    const v = (niceMax/steps)*s; const y = yAt(v);
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="rgba(42,35,30,0.06)" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#6E6357" font-family="JetBrains Mono">${v>=1000? (v/1000).toFixed(1)+'k' : Math.round(v)}</text>`;
  }
  const totalPath = totalSeries.map((v,i)=> `${i===0?'M':'L'} ${xAt(i).toFixed(1)} ${yAt(v).toFixed(1)}`).join(' ');
  const areaPath = totalPath + ` L ${xAt(days-1).toFixed(1)} ${yAt(0)} L ${xAt(0).toFixed(1)} ${yAt(0)} Z`;
  const gaodePath = linePath(gaodeSeries, xAt, yAt);
  const didiPath = linePath(didiSeries, xAt, yAt);
  let xLabels = '';
  const labelStep = Math.max(1, Math.ceil(days/7));
  for(let i=0;i<days;i+=labelStep){
    const d = parseDate(labels[i]);
    const txt = `${d.getMonth()+1}/${d.getDate()}`;
    xLabels += `<text x="${xAt(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#6E6357" font-family="JetBrains Mono">${txt}</text>`;
  }
  let dots = '';
  totalSeries.forEach((v,i)=>{ dots += `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(v).toFixed(1)}" r="2.5" fill="#2A231E" stroke="#E6A823" stroke-width="1.5"/>`; });
  let peak = '';
  let peakIdx = totalSeries.indexOf(Math.max(...totalSeries));
  if(totalSeries[peakIdx] > 0){
    const px = xAt(peakIdx), py = yAt(totalSeries[peakIdx]);
    peak = `<g><line x1="${px}" y1="${padT}" x2="${px}" y2="${py-6}" stroke="rgba(230,168,35,0.3)" stroke-width="1" stroke-dasharray="2 3"/><circle cx="${px}" cy="${py}" r="4" fill="#E6A823"/><text x="${px}" y="${py-10}" text-anchor="middle" font-size="11" fill="#A8760A" font-family="Manrope" font-weight="700">¥${Math.round(totalSeries[peakIdx])}</text></g>`;
  }
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="收入趋势图">
    <defs><linearGradient id="areaG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E6A823" stop-opacity="0.35"/><stop offset="100%" stop-color="#E6A823" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    <path d="${areaPath}" fill="url(#areaG)"/>
    <path d="${gaodePath}" fill="none" stroke="#2E8B7E" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>
    <path d="${didiPath}" fill="none" stroke="#D9682A" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>
    <path d="${totalPath}" fill="none" stroke="#E6A823" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${peak}${xLabels}
  </svg>`;
  legend.innerHTML = `
    <div class="li"><span class="sw" style="background:#E6A823"></span>合计 <b>¥${money(totalSeries.reduce((a,b)=>a+b,0))}</b></div>
    <div class="li"><span class="sw" style="background:#2E8B7E"></span>高德</div>
    <div class="li"><span class="sw" style="background:#D9682A"></span>滴滴</div>`;
}

/* ---------- Donut chart ---------- */
function drawDonut(data){
  const wrap = $('#donutChart'); const legend = $('#pfLegend'); const breakdown = $('#pfBreakdown');
  let g=0, d=0;
  data.forEach(r=>{ if(r.platform==='gaode') g+=orderIncome(r); else d+=orderIncome(r); });
  const total = g + d;
  if(total === 0){
    wrap.innerHTML = emptyChart('暂无数据'); legend.innerHTML = '';
    breakdown.innerHTML = `<div style="text-align:center;color:var(--muted-2);padding:10px;font-size:12px;">添加记录后即可查看平台占比</div>`;
    return;
  }
  const gp = total ? g/total : 0;
  const dp = total ? d/total : 0;
  const gOrders = data.filter(r=>r.platform==='gaode').length;
  const dOrders = data.filter(r=>r.platform==='didi').length;
  const cx=110, cy=110, R=82, r=54;
  const circ = 2*Math.PI*R;
  const gLen = circ * gp; const dLen = circ * dp;
  const gDash = `${gLen} ${circ - gLen}`; const dDash = `${dLen} ${circ - dLen}`;
  wrap.innerHTML = `<svg viewBox="0 0 220 220" preserveAspectRatio="xMidYMid meet" style="max-width:220px;margin:0 auto;display:block;" role="img" aria-label="平台占比">
    <defs>
      <linearGradient id="gG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#5BBAAB"/><stop offset="100%" stop-color="#2E8B7E"/></linearGradient>
      <linearGradient id="dG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E8895A"/><stop offset="100%" stop-color="#D9682A"/></linearGradient>
    </defs>
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="rgba(42,35,30,0.05)" stroke-width="${R-r}"/>
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="url(#gG)" stroke-width="${R-r}" stroke-dasharray="${gDash}" stroke-dashoffset="${circ*0.25}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="url(#dG)" stroke-width="${R-r}" stroke-dasharray="${dDash}" stroke-dashoffset="${circ*0.25 - gLen}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>
    <text x="${cx}" y="${cy-6}" text-anchor="middle" font-family="Manrope" font-size="10" fill="#9B8E7E" letter-spacing="1.5">TOTAL</text>
    <text x="${cx}" y="${cy+18}" text-anchor="middle" font-family="Manrope" font-size="26" fill="#2A231E" font-weight="700">¥${moneyParts(total).int}</text>
  </svg>`;
  legend.innerHTML = `
    <div class="li"><span class="sw" style="background:#2E8B7E"></span>高德 <b>${(gp*100).toFixed(0)}%</b></div>
    <div class="li"><span class="sw" style="background:#D9682A"></span>滴滴 <b>${(dp*100).toFixed(0)}%</b></div>`;
  const maxV = Math.max(g, d);
  breakdown.innerHTML = `
    <div class="pf-row"><div class="top"><div class="name"><span class="sw" style="background:#2E8B7E"></span>高德顺风车</div><div class="vals"><b>¥${money(g)}</b> · ${gOrders}单 · 均¥${gOrders?Math.round(g/gOrders):0}</div></div><div class="bar-track"><div class="bar-fill" style="width:${(g/maxV*100)}%;background:linear-gradient(90deg,#5BBAAB,#2E8B7E);"></div></div></div>
    <div class="pf-row"><div class="top"><div class="name"><span class="sw" style="background:#D9682A"></span>滴滴顺风车</div><div class="vals"><b>¥${money(d)}</b> · ${dOrders}单 · 均¥${dOrders?Math.round(d/dOrders):0}</div></div><div class="bar-track"><div class="bar-fill" style="width:${(d/maxV*100)}%;background:linear-gradient(90deg,#E8895A,#D9682A);"></div></div></div>`;
}

/* ---------- Hour distribution (接单时间段分布) ---------- */
function drawHourDist(data){
  const wrap = $('#hourChart'); const badge = $('#hourBadge');
  if(!data.length){ wrap.innerHTML = emptyChart('暂无数据'); badge.textContent='接单时段'; return; }
  const buckets = Array.from({length:12}, (_,i)=>({ hour:i*2, count:0, income:0 }));
  data.forEach(r=>{
    let h = 0;
    if(r.time){ const m = /^(\d{1,2}):(\d{2})/.exec(r.time); if(m) h = parseInt(m[1],10); }
    else h = parseDate(r.date).getHours();
    const idx = Math.min(11, Math.floor(h/2));
    buckets[idx].count++; buckets[idx].income += orderIncome(r);
  });
  const total = buckets.reduce((a,b)=>a+b.count,0);
  const maxC = Math.max(1, ...buckets.map(b=>b.count));
  badge.textContent = `${total} 单`;
  const W=720, H=260, padL=44, padR=16, padT=20, padB=52;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const gap = 8, barW = (innerW - gap*(buckets.length-1))/buckets.length;
  // 动态最优网格：在候选步数 [3,4,5] 与候选步长 {1,2,2.5,5,10}×mag 中
  // 挑选满足 step×stepCount≥maxC 且空间利用率最高的方案
  let niceMax = niceCeil(maxC), niceStep = niceMax / 4, stepCount = 4;
  let bestFill = maxC / niceMax;
  for (const sc of [3, 4, 5]) {
    const rawStep = maxC / sc;
    const mag = Math.pow(10, Math.max(0, Math.floor(Math.log10(rawStep))));
    for (const base of [1, 2, 2.5, 5, 10]) {
      const s = base * mag;
      if (s * sc >= maxC) {
        const fill = maxC / (s * sc);
        const isIntStep = Number.isInteger(s);
        if (fill > bestFill + 1e-6 || (Math.abs(fill - bestFill) < 1e-3 && isIntStep && !Number.isInteger(niceStep))) {
          bestFill = fill; niceMax = s * sc; niceStep = s; stepCount = sc;
        }
        break;
      }
    }
  }
  let grid = '';
  for (let s = 0; s <= stepCount; s++) {
    const v = niceStep * s; const y = padT + innerH - (v / niceMax) * innerH;
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="rgba(42,35,30,0.06)" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${y+5}" text-anchor="end" font-size="13" fill="#6E6357" font-family="JetBrains Mono">${Number.isInteger(v) ? v : v.toFixed(1)}</text>`;
  }
  let bars = '';
  buckets.forEach((b,i)=>{
    const x = padL + i*(barW+gap);
    const bh = (b.count/niceMax)*innerH;
    const peak = b.count === maxC && b.count > 0;
    const fill = peak ? 'url(#hourPeak)' : 'url(#hourBar)';
    bars += `
      <rect x="${x}" y="${padT+innerH-bh}" width="${barW}" height="${bh}" rx="3" fill="${fill}"/>
      ${b.count > 0 ? `<text x="${x+barW/2}" y="${padT+innerH-bh-6}" text-anchor="middle" font-size="14" fill="${peak?'#E6A823':'#6B6052'}" font-family="JetBrains Mono" font-weight="${peak?600:500}">${b.count}</text>` : ''}
      <text x="${x+barW/2}" y="${H-padB+16}" text-anchor="middle" font-size="13" fill="#6E6357" font-family="JetBrains Mono">${b.hour}</text>
      <text x="${x+barW/2}" y="${H-padB+34}" text-anchor="middle" font-size="13" fill="#9B8E7E" font-family="JetBrains Mono">${b.hour+2}</text>`;
  });
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="时间段分布">
    <defs>
      <linearGradient id="hourBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E6A823"/><stop offset="100%" stop-color="#C8901A"/></linearGradient>
      <linearGradient id="hourPeak" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F0C04E"/><stop offset="100%" stop-color="#E6A823"/></linearGradient>
    </defs>
    ${grid}${bars}
    <text x="${padL-8}" y="${H-6}" text-anchor="end" font-size="13" fill="#9B8E7E">点</text>
  </svg>`;
}

/* ---------- Amount distribution (订单金额分布) ---------- */
function drawAmtDist(data){
  const wrap = $('#amtChart'); const badge = $('#amtBadge');
  if(!data.length){ wrap.innerHTML = emptyChart('暂无数据'); badge.textContent='区间统计'; return; }
  const ranges = [
    { max:10,  label:'<10' }, { max:15,  label:'10-15' }, { max:20,  label:'15-20' },
    { max:25,  label:'20-25' }, { max:30,  label:'25-30' }, { max:Infinity, label:'30+' },
  ];
  const buckets = ranges.map(r=>({ label:r.label, max:r.max, count:0, sum:0 }));
  data.forEach(r=>{
    const v = orderIncome(r);
    for(const b of buckets){ if(v < b.max){ b.count++; b.sum += v; break; } }
  });
  const total = buckets.reduce((a,b)=>a+b.count,0);
  const maxC = Math.max(1, ...buckets.map(b=>b.count));
  badge.textContent = `${total} 单`;
  // 布局分区（W=720）：左标签 | 柱状区 | 数量标签区 | 均价标签区
  const W=720, H=240, padT=18, padB=18;
  const labelX = 76;
  const barStartX = 86;
  const barMaxEndX = 570;      // 柱最大宽 484（原 444）
  const countX = 582;          // 与柱尾间距 12px
  const avgX = W - 14;
  const barMaxW = barMaxEndX - barStartX;
  const innerH = H - padT - padB;
  const rowH = innerH / buckets.length;
  const barH = Math.min(22, rowH - 10);
  const pow = 0.75;
  const maxPowed = Math.pow(maxC, pow);
  let rows = '';
  buckets.forEach((b,i)=>{
    const y = padT + i*rowH + rowH/2;
    const bw = b.count > 0 ? Math.max(4, Math.pow(b.count, pow) / maxPowed * barMaxW) : 0;
    const avg = b.count ? b.sum/b.count : 0;
    const peak = b.count === maxC && b.count > 0;
    const fill = peak ? 'url(#amtPeak)' : 'url(#amtBar)';
    rows += `
      <text x="${labelX}" y="${y+5}" text-anchor="end" font-size="13" fill="#6B6052" font-family="JetBrains Mono">¥${b.label}</text>
      <rect x="${barStartX}" y="${y-barH/2}" width="${bw}" height="${barH}" rx="4" fill="${fill}"/>
      <text x="${countX}" y="${y+5}" text-anchor="start" font-size="14" fill="${peak?'#E6A823':'#6B6052'}" font-family="JetBrains Mono" font-weight="${peak?600:500}">${b.count} 单</text>
      <text x="${avgX}" y="${y+5}" text-anchor="end" font-size="13" fill="#9B8E7E" font-family="JetBrains Mono">均¥${Math.round(avg)}</text>`;
  });
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="金额分布">
    <defs>
      <linearGradient id="amtBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2E8B7E"/><stop offset="100%" stop-color="#5BBAAB"/></linearGradient>
      <linearGradient id="amtPeak" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#C8901A"/><stop offset="100%" stop-color="#F0C04E"/></linearGradient>
    </defs>
    ${rows}
  </svg>`;
}

/* ---------- range filter ---------- */
$('#rangeFilter').addEventListener('click', e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  $$('#rangeFilter .chip').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  statRange = b.dataset.range === 'all' ? 'all' : parseInt(b.dataset.range);
  renderStats();
});

genMockData();
